<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prince AI</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      animation: fadeIn 0.2s ease;
    }

    .me {
      align-self: flex-end;
      background: #007aff;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai {
      align-self: flex-start;
      background: #e5e5ea;
      color: black;
      border-bottom-left-radius: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #inputBar {
      display: flex;
      padding: 12px;
      background: white;
      border-top: 1px solid #d1d1d6;
      gap: 10px;
    }

    #prompt {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid #c7c7cc;
      outline: none;
      font-size: 15px;
      background: #f2f2f7;
    }

    #sendBtn {
      padding: 10px 18px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    #sendBtn:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>
  <div id="chat"></div>

  <div id="inputBar">
    <input id="prompt" placeholder="Message…" />
    <button id="sendBtn">Send</button>
  </div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
